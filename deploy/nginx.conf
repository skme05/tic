# Site TIC — configuration nginx (équivalent de netlify.toml)
server {
    listen 4000;
    server_name _;
    root /usr/share/nginx/html;

    # derrière un proxy (Traefik, Caddy, nginx hôte) : redirections relatives
    absolute_redirect off;
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # en-têtes de sécurité (pages d'erreur, redirections)
    include /etc/nginx/snippets/security-headers.conf;

    # sonde de santé (docker healthcheck)
    location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }

    # anciennes adresses en .html → nouvelles adresses (généré au build)
    include /etc/nginx/snippets/redirects.conf;

    # pages pré-rendues : /about → /about/index.html (sans redirection)
    location / {
        try_files $uri $uri/index.html $uri.html =404;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # fichiers compilés (nom avec empreinte) : cache d'un an
    location ~* ^/assets/.+\.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # images, polices, icônes : une semaine
    location ~* \.(webp|png|jpe?g|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # page 404 du site
    error_page 404 /404.html;
    location = /404.html { internal; }

    # Quand l'API Django tournera dans un autre conteneur, la relayer sous /api
    # (même domaine : pas de CORS) puis compiler avec VITE_API_URL=/api :
    # location /api/ {
    #     proxy_pass http://api:8000/api/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
